<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Meme Slider</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrapper">
        <div class="slider-wrapper">
            <div class="slider">
                <div class="slide slide-1">
                    <img src="./gifs/giphy_1.gif" alt="">
                </div>
                <div class="slide slide-2">
                    <img src="./gifs/giphy_2.gif" alt="">
                </div>
                <div class="slide slide-3">
                    <img src="./gifs/giphy_3.gif" alt="">
                </div>
                <div class="slide slide-4">
                    <img src="./gifs/giphy_4.gif" alt="">
                </div>
            </div>
            <div class="slider-footer">
                <div class="text-wrapper">
                    <div class="text-slider">
                        <p class="text">What the...?</p>
                        <p class="text">What???</p>
                        <p class="text">Oh my goodness</p>
                        <p class="text">Trying to figure out</p>
                    </div>
                </div>
                <div class="controllers">
                    <input type="radio" name="slider" class="radio-1" checked> 
                    <input type="radio" name="slider" class="radio-2">
                    <input type="radio" name="slider" class="radio-3">
                    <input type="radio" name="slider" class="radio-4">
                </div> 
            </div>
        </div>    
    </div>
</body>
</html>
